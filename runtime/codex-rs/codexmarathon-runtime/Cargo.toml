[package]
name = "codexmarathon-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded CodexMarathon runtime bridge for the Codex CLI"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codexmarathon-accountd-client = { workspace = true }
codexmarathon-home = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-backend-client = { workspace = true }
codex-core = { workspace = true }
codex-http-client = { workspace = true }
codex-login = { workspace = true }
codex-protocol = { workspace = true }
codexmarathon-runtime-adapter = { workspace = true }
log = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
zeroize = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
