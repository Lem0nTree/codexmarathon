[package]
name = "codexmarathon-runtime-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The narrow CodexMarathon protocol adapter seam for a Codext runtime"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
