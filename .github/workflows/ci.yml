name: CodexMarathon CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexmarathon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Native Rust CLI checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/codex-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/codex-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Validate provenance
        shell: bash
        run: python scripts/verify_provenance.py --root .
      - name: Check formatting
        shell: bash
        working-directory: runtime/codex-rs
        run: cargo fmt --all -- --check
      - name: Test native Marathon runtime
        shell: bash
        working-directory: runtime/codex-rs
        run: cargo test --locked -p codexmarathon-runtime
      - name: Build native Codex CLI
        shell: bash
        working-directory: runtime/codex-rs
        run: cargo build --locked --release -p codex-cli
      - name: Verify Marathon command surface
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: runtime/codex-rs/target/release/codex marathon --help
